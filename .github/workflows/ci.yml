name: Reproduce evaluation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test mechanism and failure boundaries
        run: python -m unittest discover -s tests -v
      - name: Evaluate and compare frozen scientific artifacts
        run: |
          python -m vtc.evaluate --out repro-output/ci
          python -m vtc.audit --run repro-output/ci
          python -m vtc.compare evidence/run-002 repro-output/ci
